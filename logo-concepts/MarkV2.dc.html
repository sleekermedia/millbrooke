<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="6 8 88 88" width="100%" height="100%" style="display:block" fill="none">
  <defs><clipPath id="{{ clipId }}"><circle cx="50" cy="52" r="{{ R }}"></circle></clipPath></defs>
  <path d="{{ sun }}" fill="{{ fg }}"></path>
  <path d="{{ rays }}" fill="{{ fg }}"></path>
  <path d="{{ arcs }}" stroke="{{ fg }}" stroke-width="3.5"></path>
  <path d="{{ ring }}" stroke="{{ fg }}" stroke-width="1.75"></path>
  <g clip-path="url(#{{ clipId }})">
    <path d="M0,52H100" stroke="{{ fg }}" stroke-width="3.5"></path>
    <path d="{{ waves }}" stroke="{{ accent }}" stroke-width="3.5"></path>
  </g>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:200},&quot;concept&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;a&quot;,&quot;b&quot;,&quot;c&quot;,&quot;d&quot;],&quot;default&quot;:&quot;a&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#192e47&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#4A6FA5&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  clipId = 'm2' + Math.random().toString(36).slice(2, 8);
  renderVals() {
    const c = this.props.concept ?? 'a';
    const fg = this.props.fg ?? '#192e47';
    const cx = 50, cy = 52, f = n => n.toFixed(2);
    const pt = (r, deg) => { const t = deg * Math.PI / 180; return f(cx + r * Math.cos(t)) + ',' + f(cy - r * Math.sin(t)); };
    const sector = (r1, r2, a1, a2) => `M${pt(r1, a1)}L${pt(r2, a1)}A${r2},${r2} 0 0 0 ${pt(r2, a2)}L${pt(r1, a2)}A${r1},${r1} 0 0 1 ${pt(r1, a1)}Z`;
    let rays = '', arcs = '', ring = '';
    if (c === 'a' || c === 'b') {
      for (let i = 1; i <= 7; i++) { const a = i * 22.5; rays += sector(18, 40, a - 4, a + 4); }
    }
    if (c === 'b') ring = `M${cx - 43},${cy}A43,43 0 1 1 ${cx + 43},${cy}A43,43 0 1 1 ${cx - 43},${cy}`;
    if (c === 'c') {
      for (let i = 0; i < 5; i++) { const a = 36 * i; rays += sector(18, 40, a + 2.5, a + 36 - 2.5); }
    }
    if (c === 'd') {
      [22, 31, 40].forEach(r => { arcs += `M${cx - r},${cy}A${r},${r} 0 0 1 ${cx + r},${cy}`; });
    }
    const R = c === 'b' ? 37 : 40;
    if (c === 'b') { rays = ''; for (let i = 1; i <= 7; i++) { const a = i * 22.5; rays += sector(17, 37, a - 4, a + 4); } }
    let waves = '';
    [61, 70, 79, 88].forEach(y => {
      waves += `M-5,${y}`;
      for (let x = -5; x < 105; x += 20) waves += `q5,-2.5 10,0q5,2.5 10,0`;
    });
    return { R, fg, accent: this.props.accent ?? fg, clipId: this.clipId, sun: `M${cx - 13},${cy}A13,13 0 0 1 ${cx + 13},${cy}Z`, rays, arcs, ring, waves };
  }
}
</script>
</body>
</html>
