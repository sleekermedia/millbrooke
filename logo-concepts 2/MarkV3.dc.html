<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="8 8 84 84" width="100%" height="100%" style="display:block">
  <defs>
    <mask id="{{ maskId }}" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect x="0" y="0" width="100" height="100" fill="#FFFFFF"></rect>
      <g fill="none" stroke="#000000" stroke-width="3.2">
        <path d="M0,50H100"></path>
        <path d="M-20,63q10,-5 20,0t20,0t20,0t20,0t20,0t20,0t20,0"></path>
        <path d="M-20,76q10,-5 20,0t20,0t20,0t20,0t20,0t20,0t20,0"></path>
      </g>
      <sc-if value="{{ isA }}" hint-placeholder-val="{{ false }}">
        <g fill="none" stroke="#000000" stroke-width="3.2">
          <path d="M34.5,50A15.5,15.5 0 0 1 65.5,50"></path>
          <path d="{{ rayGaps }}"></path>
        </g>
      </sc-if>
      <sc-if value="{{ isB }}" hint-placeholder-val="{{ false }}">
        <path d="M26,50A24,24 0 0 1 74,50Z" fill="#000000"></path>
      </sc-if>
      <sc-if value="{{ isD }}" hint-placeholder-val="{{ false }}">
        <path d="M26,50A24,24 0 0 1 74,50Z" fill="#000000"></path>
        <path d="{{ haloGaps }}" fill="none" stroke="#000000" stroke-width="3.2"></path>
      </sc-if>
      <sc-if value="{{ isC }}" hint-placeholder-val="{{ false }}">
        <path d="M36,50A14,14 0 0 1 64,50Z" fill="#000000"></path>
      </sc-if>
    </mask>
  </defs>
  <g mask="url(#{{ maskId }})">
    <path d="M10,50A40,40 0 0 1 90,50Z" fill="{{ fg }}"></path>
    <path d="M10,50A40,40 0 0 0 90,50Z" fill="{{ accent }}"></path>
  </g>
  <sc-if value="{{ hasSun }}" hint-placeholder-val="{{ false }}">
    <path d="M36.1,48.4A14,14 0 0 1 63.9,48.4Z" fill="{{ fg }}"></path>
  </sc-if>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:200},&quot;concept&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;a&quot;,&quot;b&quot;,&quot;c&quot;],&quot;default&quot;:&quot;a&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;fg&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#192e47&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#4A6FA5&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  maskId = 'm3' + Math.random().toString(36).slice(2, 8);
  renderVals() {
    const c = this.props.concept ?? 'a';
    const fg = this.props.fg ?? '#192e47';
    let rayGaps = '';
    for (let k = 1; k <= 6; k++) {
      const t = k * (180 / 7) * Math.PI / 180, x = Math.cos(t), y = Math.sin(t);
      rayGaps += `M${(50 + 15 * x).toFixed(2)},${(50 - 15 * y).toFixed(2)}L${(50 + 46 * x).toFixed(2)},${(50 - 46 * y).toFixed(2)}`;
    }
    let haloGaps = '';
    for (let k = 1; k <= 3; k++) {
      const t = k * 45 * Math.PI / 180, x = Math.cos(t), y = Math.sin(t);
      haloGaps += `M${(50 + 20 * x).toFixed(2)},${(50 - 20 * y).toFixed(2)}L${(50 + 46 * x).toFixed(2)},${(50 - 46 * y).toFixed(2)}`;
    }
    return { haloGaps, isD: c === 'd', hasSun: c === 'b' || c === 'd', isA: c === 'a', isB: c === 'b', isC: c === 'c', fg, accent: this.props.accent ?? fg, maskId: this.maskId, rayGaps };
  }
}
</script>
</body>
</html>
